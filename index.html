<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽象棋｜線上桌遊</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div><div class="eyebrow">ONLINE TABLETOP · 2–4 PLAYERS</div><h1>抽象棋</h1><p>把食物鏈排成一線，成為最後留下的玩家。</p></div><div class="turn-pill" id="turn-pill">等待加入房間</div></header>
<section id="lobby" class="panel lobby"><div class="lobby-copy"><span class="eyebrow">開一桌，邀朋友一起玩</span><h2>你的下一場棋局</h2><p>建立房間後分享代碼，朋友在不同地點也能加入同一局。</p></div><div class="lobby-controls"><label>你的暱稱<input id="name" maxlength="16" placeholder="輸入暱稱"></label><button class="primary" id="create">建立房間</button><div class="join-row"><input id="room-code" maxlength="4" placeholder="房間代碼"><button id="join">加入房間</button></div><div id="lobby-message" class="message"></div></div></section>
<section id="game" class="game hidden"><aside class="side"><div class="panel room-card"><div class="eyebrow">房間代碼</div><div class="room-code" id="room-display">----</div><button class="quiet" id="copy">複製邀請代碼</button></div><div class="panel"><div class="section-title">玩家 <span id="player-count"></span></div><div id="players"></div><button class="primary start hidden" id="start">開始遊戲</button><p class="hint" id="waiting-hint"></p></div><div class="panel legend"><div class="section-title">本局設定</div><p>5 × 5 方格棋盤<br>十字相鄰移動<br>三枚同食物鏈棋子連線即可清除</p><div class="animal-key"><span>🟤 地鼠</span><span>🟡 黃鼬</span><span>🐍 蟒蛇</span><span>🐇 兔子</span><span>🦊 赤狐</span><span>🦅 老鷹</span><span>🦐 磷蝦</span><span>🦭 海豹</span><span>🐋 虎鯨</span></div></div></aside>
<section class="table"><div class="panel board-panel"><div class="board-heading"><div><span class="eyebrow">遊戲棋盤</span><h2>食物鏈對決</h2></div><div class="bag">抽袋 <strong id="bag-count">0</strong></div></div><div id="board" class="board"></div><div class="board-help" id="action-help">等待玩家開始遊戲</div></div><div class="panel hand-panel"><div class="hand-head"><div><div class="section-title">你的手牌</div><div class="hint">點選棋子，再點棋盤放置。移動時先點棋子堆，再點相鄰格。</div></div><span class="hand-count" id="hand-count">0 枚</span></div><div id="hand" class="hand"></div></div><div class="panel log-panel"><div class="section-title">棋局紀錄</div><div id="log"></div></div></section></section><footer>遊戲規則原型 · 棋盤尺寸及部分棋子效果尚待確認</footer></main><script src="app.js"></script></body></html>
